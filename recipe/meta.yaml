{% set name = "bitsets" %}
{% set version = "0.9.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: "f4268875468ed3ba8657b1e09a984c74c88622dd7d29fa1d8d0d474b7e2daff9"

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv "
  noarch: python

requirements:
  host:
    - pip
    - python
  run:
    - python

test:
  imports:
    - bitsets

about:
  home: "https://github.com/xflr6/bitsets"
  license: "MIT"
  license_family: "MIT"
  license_file: "LICENSE.txt"
  summary: "Ordered subsets over a predefined domain"
  doc_url: https://bitsets.readthedocs.io/
  dev_url: https://github.com/xflr6/bitsets

extra:
  recipe-maintainers:
    - smirarab
